name: Build Windows Installer

# Manual-only Windows x64 build for this fork (98-key layout + cat-view mouse invert + real purr).
# Produces both the NSIS .exe and the MSI .msi installers.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag / label for the published installers'
        type: string
        default: 'v5.1.2-kuro98.2'
      publish_release:
        description: 'Create (or update) a GitHub Release with the installers'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri -- build --bundles nsis,msi

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) { $tag = 'v5.1.2-kuro98.2' }
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "out/KuroCat-$tag-x64-setup.exe"
          }
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "out/KuroCat-$tag-x64.msi"
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64
          path: out/*

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: KuroCat ${{ inputs.release_tag }} (98-key · mouse invert · real purr)
          body: |
            Windows x64 build of this fork — 基于上游 v5.1.2。

            **上游 v5.1.2 带来的东西**：AI 伙伴状态气泡（豆包 / WorkBuddy / DeepSeek / Codex / 千问 / Antigravity / Claude，含 MCP `set_agent_status`）、5 种语言界面（简中 / 繁中 / EN / 日本語 / 한국어）、2D/3D 轮廓 MCP、GPU/CPU 性能优化、更新器国内加速。

            - 98 配列（980）键盘布局：主键区与数字区拼合（只留 0.25U 机壳缝）、F 区组间距收紧、方向键按真机排布（→ 在数字区 1 的正下方，↑ 在 ↓ 正上方）
            - 98 配列配色复刻实拍键盘：奶白键帽 + 深蓝灰修饰键 + 浅灰蓝 Esc/Enter/空格/方向键，奶白机壳
            - 鼠标反转（猫视角）开关
            - 真实录音呼噜声替换，关闭时松开抚摸约 2 秒自动停止
            - 「呼噜声常驻」：设置窗口与托盘右键菜单都能开关，勾选状态双向同步
            - 呼噜音量滑块（0%–150%，点击数值复位）：常驻底噪与摸头呼噜共用同一路音量
            - 左键按住小猫 1 秒后开始哼唧，至少叫满 2 秒；哼唧音量跟随呼噜音量滑块
            - 键盘长按修复：输入钩子误报的一次「抬起」不再把长按拆成「先短按一下、再长按」——按键抬起只对「已经在自动重复」的键加 90ms 防抖（自动重复会撤销这次误报），普通打字零延迟，后端每 450ms 的按键状态校正改成「静默 700ms + 连续两次确认」才认抬起，自动重复还会顺手把键帽扶回按下状态
            - 被按住时的表情：改成小猫自带的那双有高光的眼睛（2D / 3D 都一样），不再自己画半眯眼线
            - 两只爪子分工：按住一颗键不放时又按另一颗，新键交给空着的那只爪（例如按住 D 再按 A，是左爪压 D、右爪压 A），不再让同一只爪从 D 挪到 A
            - 长按键锁定：按住一颗键的时候交替去点其他键，这颗键始终留在原来那只爪下面，另一只爪负责交替按其他键，不会再被抢走
            - 抓鼠标时手掌和鼠标同步移动：去掉了「鼠标先动、手才跟过去」的那层额外延迟（2D / 3D 都有）
            - 修复打字稍快时猫爪收不回来：自动重复撤销掉那次「抬起」之后，如果输入钩子再也没送来抬起事件（队列错序 / 漏事件），爪子会一直压在键上。现在加了兜底看门狗——会自动重复的键只要安静 900ms 还按着，就强行收爪
            - 收爪手感重做（kuro98.2）：普通打字松手即刻收爪（原来每次抬起都延后 150ms，两次击键间隔常常不到 150ms，爪子于是永远收不回去）；键帽上「点一下」的最短停留从 130ms 降到 35ms，收爪回摆速度翻倍；3D 里松手后的悬停改成从松手计时 0.16 秒（原来从按下算 0.52 秒）。**现在连打时能清楚看到爪子抬起来再按下去**
            - 切换输出设备（插耳机 / 蓝牙耳机连上）后呼噜声自动恢复，不用重启
            - 输入钩子：长按判定不再被误报的抬起拆成「短按 + 长按」（静默 700ms + 连续两次确认才认抬起）
          draft: false
          files: out/*
