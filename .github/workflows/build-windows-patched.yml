name: Build Windows (fork with mouse-invert)

# Fork-only helper: builds just the Windows NSIS installer for the patched build so the release
# assets in nawjiu/kurocat never fall behind the upstream base version.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows x64 - 65% Classic Installer)
        run: npm run tauri -- build --bundles nsis

      - name: Rename Windows installer asset
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          Copy-Item $nsis.FullName "KuroCat-$ver-mouseinvert-x64-setup.exe"
          Write-Output ("built " + (Get-Item "KuroCat-$ver-mouseinvert-x64-setup.exe").Length + " bytes")

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64-mouseinvert
          path: KuroCat-*-mouseinvert-x64-setup.exe
